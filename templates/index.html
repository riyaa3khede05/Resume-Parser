<!DOCTYPE html>
<html>
<head>
    <title>Resume Parser</title>
</head>
<body>

    <h1>Resume Parser</h1>

    <form method="POST" enctype="multipart/form-data">

        <input type="file" name="resume">

        <br><br>

        <button type="submit">Upload Resume</button>

    </form>

    <h2>Extracted Resume Text</h2>

    <pre>{{ text }}</pre>

</body>
</html>
